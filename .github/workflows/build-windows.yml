
name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build distributable
        run: gradle createDistributable --no-daemon --stacktrace

      - name: Restore Java launchers
        shell: pwsh
        run: |
          $source = "$env:JAVA_HOME\bin"
          $target = "build/compose/binaries/main/app/SportflixIPTV/runtime/bin"

          Copy-Item "$source/java.exe" $target -Force
          Copy-Item "$source/javaw.exe" $target -Force

          Write-Host "Java launchers copied successfully"

      - name: Verify Java runtime
        shell: pwsh
        run: |
          $java = "build/compose/binaries/main/app/SportflixIPTV/runtime/bin/java.exe"

          if (!(Test-Path $java)) {
            Write-Host "ERROR: java.exe is missing!"
            Get-ChildItem "build/compose/binaries/main/app/SportflixIPTV/runtime/bin" -Force
            exit 1
          }

          Write-Host "Java runtime OK"

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SportflixIPTV-Windows
          path: build/compose/binaries/main/app/SportflixIPTV/
          if-no-files-found: error
