name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build distributable
        run: gradle createDistributable --no-daemon --stacktrace

      - name: Verify Java runtime
        shell: pwsh
        run: |
          $java = "build/compose/binaries/main/app/SportflixIPTV/runtime/bin/java.exe"
          if (!(Test-Path $java)) {
            Write-Host "ERROR: java.exe is missing!"
            Get-ChildItem "build/compose/binaries/main/app/SportflixIPTV/runtime/bin" -Force
            exit 1
          }
          Write-Host "Java runtime OK"

      - uses: actions/upload-artifact@v4
        with:
          name: SportflixIPTV-Windows
          path: build/compose/binaries/main/app/SportflixIPTV/
          if-no-files-found: error
