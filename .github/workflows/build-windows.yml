name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build distributable
        run: gradle createDistributable --no-daemon --stacktrace

      - name: Show jpackage error logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "build/compose/logs/createDistributable") {
            Get-ChildItem "build/compose/logs/createDistributable" -File |
              ForEach-Object {
                Write-Host "===== $($_.Name) ====="
                Get-Content $_.FullName
              }
          } else {
            Write-Host "Log directory not found"
          }

      - uses: actions/upload-artifact@v4
  with:
    name: SportflixIPTV-Windows
    path: build/compose/binaries/main/app/
